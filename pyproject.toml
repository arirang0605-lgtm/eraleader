[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eraleader"
version = "0.1.0"
description = "EraLeader local-first research prototype; no brokerage or live data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyarrow>=12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eraleader = "eraleader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
